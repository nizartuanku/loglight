<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sentinel</title>
<style>
  /* Design tokens — dark-first (security ops aesthetic), light via media query.
     Status colors from the validated reference palette; never color alone —
     every badge carries its text label. */
  :root {
    color-scheme: dark;
    --surface-0: #111110;
    --surface-1: #1a1a19;
    --surface-2: #242422;
    --border:    #34342f;
    --text-1:    #ffffff;
    --text-2:    #c3c2b7;
    --text-3:    #8a897f;
    --critical:  #d03b3b;
    --serious:   #ec835a;
    --warning:   #fab219;
    --good:      #0ca30c;
    --accent:    #3987e5;
    --radius: 10px;
  }
  @media (prefers-color-scheme: light) {
    :root {
      color-scheme: light;
      --surface-0: #f4f4f2;
      --surface-1: #fcfcfb;
      --surface-2: #ffffff;
      --border:    #e2e1da;
      --text-1:    #0b0b0b;
      --text-2:    #52514e;
      --text-3:    #8a897f;
      --accent:    #2a78d6;
    }
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--surface-0); color: var(--text-1);
    max-width: 1080px; margin: 0 auto; padding: 24px 20px 64px;
  }
  header { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 6px; }
  h1 { font-size: 22px; font-weight: 650; letter-spacing: -0.01em; }
  .tier {
    font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em;
    color: var(--accent); border: 1px solid var(--accent);
    padding: 2px 10px; border-radius: 999px;
  }
  .notice {
    margin: 12px 0; padding: 10px 14px; border-radius: var(--radius);
    background: color-mix(in srgb, var(--warning) 12%, var(--surface-1));
    border: 1px solid color-mix(in srgb, var(--warning) 45%, transparent);
    color: var(--text-1); font-size: 14px;
  }
  .muted { color: var(--text-3); }

  /* Decisions row — stat tiles (not a chart; a headline number per state). */
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 20px 0 28px; }
  .tile {
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 14px 16px;
  }
  .tile .num { font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .tile .lbl { font-size: 12.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; display: flex; align-items: center; gap: 7px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .tile.ok .num { color: var(--good); }

  section { margin-bottom: 34px; }
  h2 { font-size: 15px; font-weight: 650; text-transform: uppercase; letter-spacing: .05em; color: var(--text-2); margin-bottom: 12px; }
  .card {
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: var(--radius); overflow: hidden;
  }

  /* Findings — worst first; remediation is part of the row, not hidden. */
  .finding { padding: 14px 16px; border-bottom: 1px solid var(--border); }
  .finding:last-child { border-bottom: none; }
  .frow { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .badge {
    font-size: 11px; font-weight: 700; letter-spacing: .05em;
    padding: 2px 8px; border-radius: 5px; color: #fff;
  }
  .badge.critical { background: var(--critical); }
  .badge.high     { background: var(--serious); }
  .badge.medium   { background: var(--warning); color: #1a1a19; }
  .badge.low, .badge.info { background: var(--surface-2); color: var(--text-2); border: 1px solid var(--border); }
  .badge.resolved { background: var(--good); }
  .badge.acknowledged { background: var(--surface-2); color: var(--text-2); border: 1px solid var(--border); }
  .ftarget { font-weight: 600; }
  .ftitle { color: var(--text-2); }
  .fix { margin-top: 6px; font-size: 14px; color: var(--text-2); }
  .fix b { color: var(--text-1); font-weight: 600; }
  .factions { margin-top: 8px; display: flex; gap: 8px; }
  .factions button, .evbtn {
    font-size: 12.5px; padding: 3px 10px; border-radius: 6px; cursor: pointer;
    background: var(--surface-2); color: var(--text-2); border: 1px solid var(--border);
  }
  .factions button:hover, .evbtn:hover { color: var(--text-1); }
  .evidence {
    margin-top: 8px; padding: 10px 12px; border-radius: 6px;
    background: var(--surface-0); border: 1px solid var(--border);
    font: 12.5px/1.6 ui-monospace, monospace; color: var(--text-2);
    white-space: pre-wrap; word-break: break-all; display: none;
  }
  .allclear { padding: 28px 16px; text-align: center; color: var(--text-2); }
  .allclear .big { font-size: 26px; }

  /* Targets & settings */
  .row { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--border); }
  .row:last-child { border-bottom: none; }
  .row .grow { flex: 1; font-variant-numeric: tabular-nums; }
  form.add { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border); }
  input[type=text] {
    flex: 1; padding: 8px 12px; border-radius: 7px; font-size: 14px;
    background: var(--surface-0); color: var(--text-1); border: 1px solid var(--border);
  }
  input[type=text]:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
  button.primary {
    padding: 8px 16px; border-radius: 7px; border: none; cursor: pointer;
    background: var(--accent); color: #fff; font-weight: 600; font-size: 14px;
  }
  button.primary:disabled { opacity: .5; cursor: not-allowed; }
  button.ghost {
    padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 13px;
    background: transparent; color: var(--text-3); border: 1px solid var(--border);
  }
  button.ghost:hover { color: var(--critical); border-color: var(--critical); }
  .toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .err { color: var(--critical); font-size: 13.5px; margin-top: 8px; }
  .okmsg { color: var(--good); font-size: 13.5px; margin-top: 8px; }
  footer { margin-top: 40px; font-size: 12.5px; color: var(--text-3); }
</style>
</head>
<body>
  <header>
    <h1 id="product">Sentinel</h1>
    <span class="tier" id="tier">…</span>
    <span class="muted" id="targetcount"></span>
  </header>
  <div id="notice" class="notice" style="display:none"></div>

  <div class="tiles" id="tiles"></div>

  <section>
    <div class="toolbar">
      <h2 style="margin:0">Findings</h2>
      <button class="primary" id="scanbtn" onclick="scanNow()">Scan now</button>
    </div>
    <div class="card" id="findings"><div class="allclear muted">Loading…</div></div>
  </section>

  <section id="verifysection" style="display:none">
    <h2>Domain verification</h2>
    <div class="card" id="verify"></div>
  </section>

  <section id="trapsection" style="display:none">
    <h2>Traps</h2>
    <div class="card">
      <div id="traps"></div>
      <form class="add" onsubmit="return mintTrap(event)" style="flex-wrap:wrap;gap:8px">
        <select id="trapkind" onchange="trapKindChanged()">
          <option value="web_token">Web / URL token</option>
          <option value="doc_beacon">Document beacon</option>
          <option value="honeypot">Honeypot service</option>
          <option value="dns_token">DNS token</option>
          <option value="cloud_cred">Cloud credential</option>
        </select>
        <input type="text" id="traplabel" placeholder="Name it like something valuable — e.g. 2026_salaries.xlsx" autocomplete="off" style="flex:1;min-width:220px">
        <select id="trapformat" style="display:none"><option value="docx">.docx</option><option value="xlsx">.xlsx</option><option value="pdf">.pdf</option></select>
        <select id="trapservice" style="display:none"><option value="ssh">SSH</option><option value="rdp">RDP</option><option value="http">HTTP admin</option><option value="postgres">PostgreSQL</option><option value="mysql">MySQL</option><option value="redis">Redis</option><option value="mongodb">MongoDB</option></select>
        <input type="number" id="trapport" placeholder="port" style="display:none;width:90px" min="1" max="65535">
        <button class="primary">Plant trap</button>
      </form>
      <div id="traperr" class="err"></div>
    </div>
  </section>

  <section id="inventorysection" style="display:none">
    <h2>Add inventory</h2>
    <div class="card">
      <form class="add" onsubmit="return addProduct(event)" style="gap:8px;flex-wrap:wrap">
        <input type="text" id="invproduct" placeholder="product — e.g. nginx" autocomplete="off" style="flex:1;min-width:180px">
        <input type="text" id="invversion" placeholder="version — e.g. 1.24.0" autocomplete="off" style="width:170px">
        <button class="primary">Resolve &amp; add</button>
      </form>
      <div class="row" style="margin-top:10px;gap:8px">
        <span class="muted grow">Or import an SBOM (CycloneDX / SPDX JSON):</span>
        <input type="file" id="sbomfile" accept=".json,application/json" onchange="uploadSBOM(this)">
      </div>
      <div id="inverr" class="err"></div>
      <div id="invmsg" class="okmsg"></div>
    </div>
  </section>

  <section id="configsection" style="display:none">
    <h2>Firewall configs</h2>
    <div class="card">
      <div id="configs"></div>
      <form class="add" onsubmit="return saveConfig(event)" style="flex-direction:column;align-items:stretch;gap:8px">
        <div class="row" style="gap:8px;flex-wrap:wrap">
          <input type="text" id="cfgname" placeholder="Name it — e.g. edge-fw-01" autocomplete="off" style="flex:1;min-width:200px">
          <select id="cfgvendor" style="min-width:170px"></select>
          <input type="file" id="cfgfile" accept=".txt,.conf,.cfg,.rules,.xml,text/plain" onchange="loadConfigFile(this)">
        </div>
        <textarea id="cfgtext" placeholder="Paste your firewall config here (iptables-save, Cisco ASA access-lists, pfSense/OPNsense config.xml, or FortiGate policy)" rows="9" style="width:100%;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;resize:vertical"></textarea>
        <div class="row" style="gap:8px">
          <button class="primary">Audit config</button>
          <span class="muted grow">Re-uploading the same name replaces it and re-audits.</span>
        </div>
      </form>
      <div id="cfgerr" class="err"></div>
      <div id="cfgmsg" class="okmsg"></div>
    </div>
  </section>

  <section id="sourcesection" style="display:none">
    <h2>Log sources</h2>
    <div class="card">
      <div id="sources"></div>
      <form class="add" onsubmit="return saveSource(event)" style="flex-wrap:wrap;gap:8px">
        <input type="text" id="srcname" placeholder="Name it — e.g. edge-fw-syslog" autocomplete="off" style="flex:1;min-width:180px">
        <select id="srctype" onchange="srcTypeChanged()" style="min-width:200px"></select>
        <input type="text" id="srcp_udp" placeholder="UDP listen (0.0.0.0:5514)" autocomplete="off" style="display:none;min-width:180px">
        <input type="text" id="srcp_tcp" placeholder="TCP listen (0.0.0.0:5514)" autocomplete="off" style="display:none;min-width:180px">
        <input type="text" id="srcp_path" placeholder="File path (/var/log/auth.log)" autocomplete="off" style="display:none;flex:1;min-width:220px">
        <input type="text" id="srcp_unit" placeholder="journald unit (optional, e.g. sshd.service)" autocomplete="off" style="display:none;flex:1;min-width:220px">
        <input type="text" id="srcp_container" placeholder="Docker container name/id" autocomplete="off" style="display:none;flex:1;min-width:220px">
        <button class="primary">Add source</button>
      </form>
      <div id="srcerr" class="err"></div>
      <div id="srcmsg" class="okmsg"></div>
    </div>
  </section>

  <section id="targetsection">
    <h2 id="targetshdr">Targets</h2>
    <div class="card">
      <div id="targets"></div>
      <form class="add" onsubmit="return addTarget(event)">
        <input type="text" id="newtarget" placeholder="example.com or example.com:8443" autocomplete="off">
        <button class="primary">Add</button>
      </form>
    </div>
    <div id="targeterr" class="err"></div>
  </section>

  <section>
    <h2>License</h2>
    <div class="card">
      <div class="row"><span class="grow" id="licinfo">Free edition</span></div>
      <form class="add" onsubmit="return setLicense(event)">
        <input type="text" id="lickey" placeholder="Paste your license key (SNTL1-…)" autocomplete="off">
        <button class="primary">Activate</button>
      </form>
    </div>
    <div id="licmsg"></div>
  </section>

  <footer>Self-hosted. Your data never leaves this machine.</footer>

<script>
const $ = id => document.getElementById(id);
const j = (url, opts) => fetch(url, opts).then(async r => {
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.error || r.statusText);
  return body;
});

// Severity metadata: color + label always travel together (never color alone).
const SEV = [
  ["critical", "Critical", "var(--critical)"],
  ["high",     "High",     "var(--serious)"],
  ["medium",   "Medium",   "var(--warning)"],
  ["low",      "Low",      "var(--text-3)"],
];
const sevRank = s => ({critical:4, high:3, medium:2, low:1, info:0}[s] ?? 0);

async function refresh() {
  try {
    const [sum, findings, targets, verification] = await Promise.all([
      j("/api/summary"), j("/api/findings"), j("/api/targets"), j("/api/verification"),
    ]);
    render(sum, findings, targets);
    renderVerification(verification);
  } catch (e) { /* transient — next tick retries */ }
}

// Verification panel: shown only when the product gates on ownership AND there
// are pending domains. CertWatch (no verify store) → applicable:false → hidden.
function renderVerification(v) {
  const section = $("verifysection");
  const pending = (v.applicable ? v.challenges : []).filter(c => c.state !== "verified");
  if (!pending.length) { section.style.display = "none"; return; }
  section.style.display = "";
  $("verify").innerHTML = pending.map(c => `
    <div class="finding">
      <div class="frow">
        <span class="badge medium">PENDING</span>
        <span class="ftarget">${esc(c.domain)}</span>
        <span class="ftitle">not verified — scanning paused until you prove ownership</span>
      </div>
      <div class="fix" style="margin-top:10px">Add <b>either</b> proof, then it verifies automatically on the next scan:</div>
      <div class="evidence" style="display:block;margin-top:8px">DNS TXT record
  name:  ${esc(c.dns_record)}
  value: ${esc(c.dns_value)}

— or — HTTP file
  url:      ${esc(c.http_url)}
  contents: ${esc(c.http_contents)}</div>
    </div>`).join("");
}

function render(sum, findings, targets) {
  $("product").textContent = sum.product;
  $("tier").textContent = sum.tier.toUpperCase();
  $("targetcount").textContent =
    sum.targets + (sum.max_targets ? "/" + sum.max_targets : "") + " target" + (sum.targets === 1 ? "" : "s");
  $("notice").style.display = sum.notice ? "" : "none";
  $("notice").textContent = sum.notice || "";
  $("scanbtn").style.display = sum.can_scan_now ? "" : "none";
  if (sum.target_kind === "domain") {
    $("newtarget").placeholder = "example.com";
    $("targetshdr").textContent = "Domains";
  }
  const isTrap = sum.target_kind === "trap";
  $("trapsection").style.display = isTrap ? "" : "none";
  $("targetsection").style.display = isTrap ? "none" : "";
  if (isTrap) loadTraps();
  const isCPE = sum.target_kind === "cpe";
  $("inventorysection").style.display = isCPE ? "" : "none";
  if (isCPE) { $("targetshdr").textContent = "Inventory"; $("newtarget").placeholder = "cpe:2.3:a:vendor:product:version:*:*:*:*:*:*:*"; }
  const isConfig = sum.target_kind === "config";
  $("configsection").style.display = isConfig ? "" : "none";
  if (isConfig) { $("targetsection").style.display = "none"; loadConfigs(); }
  const isSource = sum.target_kind === "source";
  $("sourcesection").style.display = isSource ? "" : "none";
  if (isSource) { $("targetsection").style.display = "none"; loadSources(); }

  // Decision tiles: the worst news first; all-clear is a positive statement.
  const tiles = SEV.map(([key, label, color]) => {
    const n = sum.counts[key] || 0;
    return `<div class="tile"><div class="lbl"><span class="dot" style="background:${color}"></span>${label}</div>
            <div class="num">${n}</div></div>`;
  }).join("");
  $("tiles").innerHTML = tiles;

  // Findings list — open + acknowledged + fresh resolved, worst first.
  const visible = findings
    .filter(f => f.status !== "suppressed")
    .sort((a, b) => (b.status === "open") - (a.status === "open") || sevRank(b.severity) - sevRank(a.severity));
  if (!visible.length) {
    $("findings").innerHTML =
      `<div class="allclear"><div class="big">✅</div>All clear — nothing needs your attention.</div>`;
  } else {
    $("findings").innerHTML = visible.map(f => `
      <div class="finding">
        <div class="frow">
          <span class="badge ${f.status === "resolved" ? "resolved" : f.severity}">
            ${f.status === "resolved" ? "RESOLVED" : f.severity.toUpperCase()}</span>
          ${f.status === "acknowledged" ? '<span class="badge acknowledged">ACK</span>' : ""}
          <span class="ftarget">${esc(f.target)}</span>
          <span class="ftitle">${esc(f.title)}</span>
        </div>
        ${f.status !== "resolved" ? `<div class="fix"><b>Fix:</b> ${esc(f.remediation)}</div>` : ""}
        <div class="factions">
          ${f.status === "open" ? `<button onclick="setStatus('${f.fingerprint}','acknowledged')">Acknowledge</button>` : ""}
          ${f.status !== "resolved" ? `<button onclick="setStatus('${f.fingerprint}','suppressed')">Suppress</button>` : ""}
          ${f.evidence ? `<button class="evbtn" onclick="toggleEv(this)">Details</button>` : ""}
        </div>
        ${f.evidence ? `<div class="evidence">${esc(JSON.stringify(f.evidence, null, 2))}</div>` : ""}
      </div>`).join("");
  }

  // Targets
  const kind = sum.target_kind === "domain" ? "domain" : (sum.target_kind === "trap" ? "trap" : (sum.target_kind === "cpe" ? "item" : (sum.target_kind === "config" ? "config" : (sum.target_kind === "source" ? "source" : "host"))));
  $("targets").innerHTML = targets.length
    ? targets.map(t => `
        <div class="row"><span class="grow">${esc(t.Canonical)}</span>
        <button class="ghost" onclick="removeTarget('${esc(t.Canonical)}')">Remove</button></div>`).join("")
    : `<div class="row muted">No ${kind}s yet — add your first ${kind} below.</div>`;

  // Free-edition license line, derived from the product's own limits.
  if (sum.tier === "free") {
    const cap = sum.max_targets ? `${sum.max_targets} ${kind}${sum.max_targets === 1 ? "" : "s"}` : `unlimited ${kind}s`;
    $("licinfo").textContent = `Free edition — up to ${cap}, webhook notifications.`;
  }
}

async function refreshLicense() {
  try {
    const lic = await j("/api/license");
    // Only override for a licensed key; the free line is set by render() from
    // the product's own limits (targets vs configs vs sources, real retention).
    if (lic.email) {
      $("licinfo").textContent =
        `${lic.tier.toUpperCase()} — licensed to ${lic.email}, valid until ${new Date(lic.expires_at).toLocaleDateString()}`;
    }
  } catch (e) {}
}

async function addTarget(ev) {
  ev.preventDefault();
  $("targeterr").textContent = "";
  try {
    await j("/api/targets", { method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ target: $("newtarget").value }) });
    $("newtarget").value = "";
    refresh();
  } catch (e) { $("targeterr").textContent = e.message; }
  return false;
}

async function removeTarget(canonical) {
  await j("/api/targets?canonical=" + encodeURIComponent(canonical), { method: "DELETE" });
  refresh();
}

async function setStatus(fingerprint, status) {
  await j("/api/findings/status", { method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ fingerprint, status }) });
  refresh();
}

async function scanNow() {
  const b = $("scanbtn"); b.disabled = true; b.textContent = "Scanning…";
  try { await j("/api/scan", { method: "POST" }); } catch (e) {}
  b.disabled = false; b.textContent = "Scan now";
  refresh();
}

// --- Decoy traps ------------------------------------------------------------
const KIND_LABEL = { web_token:"Web token", doc_beacon:"Document beacon", honeypot:"Honeypot", dns_token:"DNS token", cloud_cred:"Cloud credential" };

function trapKindChanged() {
  const k = $("trapkind").value;
  $("trapformat").style.display  = k === "doc_beacon" ? "" : "none";
  $("trapservice").style.display = k === "honeypot"   ? "" : "none";
  $("trapport").style.display    = k === "honeypot"   ? "" : "none";
}

async function loadTraps() {
  try { const d = await j("/api/decoy/deployments"); renderTraps(d.deployments || []); } catch (e) {}
}

function renderTraps(deps) {
  if (!deps.length) {
    $("traps").innerHTML = `<div class="row muted">No traps yet — plant your first below. It stays silent until someone touches it.</div>`;
    return;
  }
  $("traps").innerHTML = deps.map(d => {
    let detail = "";
    if (d.kind === "honeypot") detail = `<span class="ftitle">${esc(d.service)} on port ${d.port}</span>`;
    else if (d.kind === "dns_token") detail = `<span class="ftitle">${esc(d.host)}</span>`;
    let art = "";
    if (d.url) art += `<div class="evidence" style="display:block;margin:8px 0">${esc(d.url)}</div><button type="button" onclick="copyText('${esc(d.url)}')">Copy URL</button>`;
    if (d.kind === "doc_beacon") ["docx","xlsx","pdf"].forEach(f =>
      art += ` <a href="/api/decoy/artifact?id=${encodeURIComponent(d.id)}&format=${f}"><button type="button">.${f}</button></a>`);
    if (d.kind === "cloud_cred")
      art += ` <a href="/api/decoy/artifact?id=${encodeURIComponent(d.id)}"><button type="button">Download credentials file</button></a>`;
    return `<div class="finding"><div class="frow">
        <span class="badge low">${KIND_LABEL[d.kind] || d.kind}</span>
        <span class="ftarget">${esc(d.label)}</span>${detail}</div>
      <div class="factions">${art}
        <button class="ghost" onclick="deleteTrap('${esc(d.id)}')">Delete</button></div></div>`;
  }).join("");
}

async function mintTrap(ev) {
  ev.preventDefault();
  $("traperr").textContent = "";
  const body = { kind: $("trapkind").value, label: $("traplabel").value };
  if (body.kind === "doc_beacon") body.format = $("trapformat").value;
  if (body.kind === "honeypot") { body.service = $("trapservice").value; body.port = parseInt($("trapport").value, 10) || 0; }
  try {
    await j("/api/decoy/deployments", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(body) });
    $("traplabel").value = ""; $("trapport").value = "";
    loadTraps(); refresh();
  } catch (e) { $("traperr").textContent = e.message; }
  return false;
}

async function deleteTrap(id) {
  try { await j("/api/decoy/deployments?id=" + encodeURIComponent(id), { method:"DELETE" }); } catch (e) {}
  loadTraps(); refresh();
}

function copyText(t) { if (navigator.clipboard) navigator.clipboard.writeText(t); }

// --- Patchlight inventory ---------------------------------------------------
async function addProduct(ev) {
  ev.preventDefault();
  $("inverr").textContent = ""; $("invmsg").textContent = "";
  try {
    const r = await j("/api/patchlight/add", { method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ product: $("invproduct").value, version: $("invversion").value }) });
    $("invmsg").textContent = "Added: " + r.label + "  (" + r.added + ")";
    $("invproduct").value = ""; $("invversion").value = "";
    refresh();
  } catch (e) { $("inverr").textContent = e.message; }
  return false;
}

async function uploadSBOM(input) {
  const f = input.files[0]; if (!f) return;
  $("inverr").textContent = ""; $("invmsg").textContent = "Parsing SBOM…";
  try {
    const text = await f.text();
    const r = await j("/api/patchlight/sbom", { method:"POST", headers:{"Content-Type":"application/json"}, body: text });
    let msg = "Imported " + r.added + " item" + (r.added === 1 ? "" : "s");
    if (r.limited) msg += " · " + r.limited + " over tier limit";
    if (r.skipped) msg += " · " + r.skipped + " duplicate";
    $("invmsg").textContent = msg;
    refresh();
  } catch (e) { $("inverr").textContent = e.message; }
  input.value = "";
}

// --- RuleHawk firewall configs ----------------------------------------------
let cfgVendorsLoaded = false;

async function loadConfigs() {
  try {
    const d = await j("/api/rulehawk/configs");
    if (!cfgVendorsLoaded && Array.isArray(d.vendors)) {
      $("cfgvendor").innerHTML = d.vendors.map(v =>
        `<option value="${esc(v.id)}">${esc(v.label)}</option>`).join("");
      cfgVendorsLoaded = true;
    }
    renderConfigs(d.configs || []);
  } catch (e) {}
}

function renderConfigs(cfgs) {
  if (!cfgs.length) {
    $("configs").innerHTML = `<div class="row muted">No configs yet — paste or upload your first below. Set a baseline once it looks right, and RuleHawk flags any drift from it.</div>`;
    return;
  }
  $("configs").innerHTML = cfgs.map(c => `
    <div class="finding"><div class="frow">
      <span class="badge low">${esc(c.vendor)}</span>
      <span class="ftarget">${esc(c.name)}</span>
      <span class="ftitle">${c.has_baseline ? "baseline set — drift is tracked" : "no baseline yet"}</span>
    </div>
    <div class="factions">
      <button onclick="setBaseline('${esc(c.name)}')">${c.has_baseline ? "Update baseline" : "Set as baseline"}</button>
      <button class="ghost" onclick="deleteConfig('${esc(c.name)}')">Remove</button>
    </div></div>`).join("");
}

function loadConfigFile(input) {
  const f = input.files[0]; if (!f) return;
  const reader = new FileReader();
  reader.onload = () => {
    $("cfgtext").value = reader.result;
    if (!$("cfgname").value) $("cfgname").value = f.name.replace(/\.[^.]+$/, "");
  };
  reader.readAsText(f);
  input.value = "";
}

async function saveConfig(ev) {
  ev.preventDefault();
  $("cfgerr").textContent = ""; $("cfgmsg").textContent = "";
  try {
    const r = await j("/api/rulehawk/config", { method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ name: $("cfgname").value, vendor: $("cfgvendor").value, config: $("cfgtext").value }) });
    let msg = `Audited "${r.saved}" — ${r.rules} rule${r.rules === 1 ? "" : "s"} parsed`;
    if (r.unparsed) msg += `, ${r.unparsed} line${r.unparsed === 1 ? "" : "s"} skipped`;
    $("cfgmsg").textContent = msg;
    $("cfgname").value = ""; $("cfgtext").value = "";
    loadConfigs(); refresh();
  } catch (e) { $("cfgerr").textContent = e.message; }
  return false;
}

async function setBaseline(name) {
  $("cfgerr").textContent = ""; $("cfgmsg").textContent = "";
  try {
    await j("/api/rulehawk/baseline", { method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ name }) });
    $("cfgmsg").textContent = `Baseline set for "${name}" — future changes show as drift.`;
    loadConfigs(); refresh();
  } catch (e) { $("cfgerr").textContent = e.message; }
}

async function deleteConfig(name) {
  try { await j("/api/rulehawk/config?name=" + encodeURIComponent(name), { method:"DELETE" }); } catch (e) {}
  loadConfigs(); refresh();
}

// --- Loglight log sources ---------------------------------------------------
let srcTypesLoaded = false;
const SRC_PARAMS = {
  syslog:   ["udp", "tcp"],
  windows:  ["udp", "tcp"],
  file:     ["path"],
  journald: ["unit"],
  docker:   ["container"],
};

function srcTypeChanged() {
  const t = $("srctype").value;
  const wanted = SRC_PARAMS[t] || [];
  ["udp","tcp","path","unit","container"].forEach(p => {
    $("srcp_" + p).style.display = wanted.includes(p) ? "" : "none";
  });
}

async function loadSources() {
  try {
    const d = await j("/api/loglight/sources");
    if (!srcTypesLoaded && Array.isArray(d.types)) {
      $("srctype").innerHTML = d.types.map(t => `<option value="${esc(t.id)}">${esc(t.label)}</option>`).join("");
      srcTypesLoaded = true;
      srcTypeChanged();
    }
    renderSources(d.sources || []);
  } catch (e) {}
}

function renderSources(srcs) {
  if (!srcs.length) {
    $("sources").innerHTML = `<div class="row muted">No sources yet — add one below. Point syslog, a log file, journald, Docker, or a Windows forwarder at Loglight and it watches for attacks.</div>`;
    return;
  }
  $("sources").innerHTML = srcs.map(s => {
    const rate = Math.round((s.parse_rate ?? 1) * 100);
    const rateNote = rate < 50 ? ` · <span style="color:var(--warning)">parse ${rate}%</span>` : ` · parse ${rate}%`;
    const detail = Object.entries(s.params || {}).filter(([k,v]) => v).map(([k,v]) => `${esc(k)}=${esc(v)}`).join("  ");
    return `<div class="finding"><div class="frow">
        <span class="badge low">${esc(s.type)}</span>
        <span class="ftarget">${esc(s.name)}</span>
        <span class="ftitle">${esc(detail)}${rateNote}</span></div>
      <div class="factions"><button class="ghost" onclick="deleteSource('${esc(s.name)}')">Remove</button></div></div>`;
  }).join("");
}

async function saveSource(ev) {
  ev.preventDefault();
  $("srcerr").textContent = ""; $("srcmsg").textContent = "";
  const type = $("srctype").value;
  const params = {};
  (SRC_PARAMS[type] || []).forEach(p => { const v = $("srcp_" + p).value.trim(); if (v) params[p] = v; });
  try {
    const r = await j("/api/loglight/source", { method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ name: $("srcname").value, type, params }) });
    $("srcmsg").textContent = `Source "${r.saved}" added — now ingesting.`;
    $("srcname").value = "";
    ["udp","tcp","path","unit","container"].forEach(p => $("srcp_" + p).value = "");
    loadSources(); refresh();
  } catch (e) { $("srcerr").textContent = e.message; }
  return false;
}

async function deleteSource(name) {
  try { await j("/api/loglight/source?name=" + encodeURIComponent(name), { method:"DELETE" }); } catch (e) {}
  loadSources(); refresh();
}

async function setLicense(ev) {
  ev.preventDefault();
  $("licmsg").textContent = ""; $("licmsg").className = "";
  try {
    const res = await j("/api/license", { method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ key: $("lickey").value }) });
    $("licmsg").textContent = "Activated: " + res.tier.toUpperCase();
    $("licmsg").className = "okmsg";
    $("lickey").value = "";
    refresh(); refreshLicense();
  } catch (e) { $("licmsg").textContent = e.message; $("licmsg").className = "err"; }
  return false;
}

function toggleEv(btn) {
  const ev = btn.closest(".finding").querySelector(".evidence");
  ev.style.display = ev.style.display === "block" ? "none" : "block";
}
function esc(s) { const d = document.createElement("div"); d.textContent = s ?? ""; return d.innerHTML; }

refresh(); refreshLicense();
setInterval(refresh, 10000);
</script>
